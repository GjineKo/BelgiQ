<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2948ed"><meta name="description" content="Le quiz belge qui a la frite. Dix questions, trois langues et un classement : français, Nederlands, English."><title>BelgiQ · Le quiz qui a la frite</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div class="flag-stripe" aria-hidden="true"></div><header><a class="brand" href="/">Belgi<span>Q</span><span class="brand-flag" aria-label="Belgique / België / Belgium">🇧🇪</span></a><div class="languages" role="group" aria-label="Langue / Taal / Language"><button data-lang="fr" aria-pressed="true" lang="fr" title="Français">FR</button><button data-lang="nl" aria-pressed="false" lang="nl" title="Nederlands">NL</button><button data-lang="en" aria-pressed="false" lang="en" title="English">EN</button></div></header>
<main><section id="home"><div class="hero-copy"><span class="edition" data-i18n="edition">DEVOXX · BELGIUM 2026</span><div class="eyebrow" data-i18n="eyebrow">LE QUIZ QUI A LA FRITE</div><h1><span data-i18n="title1">Petit pays.</span><br><em data-i18n="title2">Grande belgitude.</em></h1><p class="intro" data-i18n="intro"></p><div class="tags"><span>🌍 <b data-i18n="cat1"></b></span><span>🏰 <b data-i18n="cat2"></b></span><span>🍟 <b data-i18n="cat3"></b></span><span>🎨 <b data-i18n="cat4"></b></span></div><form id="start-form"><label for="home-nickname" data-i18n="nickname"></label><div class="start-row"><input id="home-nickname" autocomplete="nickname" minlength="2" maxlength="24" required data-placeholder="placeholder"><button class="primary" id="start" data-i18n="start"></button></div><p class="hint" data-i18n="hint"></p></form></div><div class="sticker-stage"><div class="sticker-note" data-i18n="sticker"></div><img id="hero-art" src="/assets/belgian-stickers.png" width="1024" height="1024" alt=""><div class="slanted-note" data-i18n="tagline"></div><span class="scribble" aria-hidden="true">★</span></div></section>
<section id="game" class="game-card" hidden><div class="quiz-meta"><span id="category"></span><span id="counter"></span></div><div class="progress" role="progressbar" aria-label="Quiz" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="progress"></div></div><h2 id="question" tabindex="-1"></h2><div id="answers"></div><div id="feedback" role="status" hidden></div><button class="primary" id="next" hidden></button><p id="language-help" class="hint" data-i18n="languageHelp"></p></section>
<section id="result" class="result-card" hidden><div class="eyebrow" data-i18n="verdict"></div><div class="result-layout"><div><div class="score"><span id="score">0</span><small>/10</small><span class="score-star" aria-hidden="true">★</span></div><h2 id="result-title"></h2><p id="result-text"></p><div class="result-stats"><span><b data-i18n="time"></b> <span id="elapsed"></span></span><span><b data-i18n="language"></b> <span id="game-language"></span></span></div></div><div class="result-actions"><form id="save-form"><label for="nickname" data-i18n="nickname"></label><input id="nickname" minlength="2" maxlength="24" autocomplete="nickname" required><button class="primary" id="save" data-i18n="save"></button><p class="hint" data-i18n="publicHint"></p></form><p id="saved" role="status" hidden></p><button class="secondary" id="replay" data-i18n="replay"></button></div></div></section>
<aside class="leaderboard"><div class="board-head"><div><span class="board-kicker">★ TOP 20</span><h2><span data-i18n="board"></span> <span aria-hidden="true">🏆</span></h2><p data-i18n="boardIntro"></p></div><button class="text-button" id="refresh" data-i18n="refresh"></button></div><ol id="ranking" aria-live="polite"></ol></aside><div id="error" role="alert" hidden><span id="error-text"></span><button id="dismiss-error" type="button">×</button></div></main><footer><span data-i18n="footer"></span><span>BelgiQ 🇧🇪</span></footer>
</body></html>
